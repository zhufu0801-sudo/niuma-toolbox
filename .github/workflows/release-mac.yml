# 打 Mac 安装包（中文版、日文版）：在 GitHub 的 Mac 上打，node_modules 里是 Mac 用的组件。
# 在 Windows 上打的 Mac 包缺 Mac 版的图片组件（@napi-rs/canvas），照片转打印稿等功能在 Mac 上会用不了，所以 Mac 包请用这里打的。
# 手动运行：Actions → 打 Mac 安装包 → Run workflow；推送 v 开头的标签（如 v0.16.0）时自动运行，并把两个 zip 加到同名的 Release 里。
name: 打 Mac 安装包

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: 下载最新的日本邮编数据（日本邮政每月更新）
        run: node scripts/data/update-postal-jp.mjs
      - name: 打包
        run: |
          mkdir -p runtime
          node scripts/package/build-release.mjs --base . --out release --only mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-packages
          path: release/*.zip
          retention-days: 30
      - name: 加到 Release（只在推送标签时）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME" --notes "测试版。"
          gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
